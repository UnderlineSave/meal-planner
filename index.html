<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Planner</title>
</head>
<body>
  <header>
    <h1>Meal planer</h1>
  </header>

  <main>
    <!-- Area 1: foods I've defined-->
     <section id="foods">
        <h2>My foods</h2>

        <form id="add-food-form">
            <input type="text" id="food-name" placeholder="Name">
            <input type="number" id="food-calories" placeholder="Calories">
            <input type="number" id="food-protein" placeholder="Protein (g)">
            <button type="submit">Add food</button>
        </form>

        <ul id="food-list"></ul>
     </section>

     <!-- Area 2: What I'm eating today-->
      <section id="plan">
        <h2>Today's plan</h2>
        <ul id="plan-list"></ul>
      </section>

      <!-- Area 3: The running totals-->
       <section id="totals">
        <h2>Totals</h2>
        <p>Calories: <span id="total-calories">0</span></p>
        <p>Protein: <span id="total-protein">0</span></p>
       </section>
  </main>
</body>
</html>
